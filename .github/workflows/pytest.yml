
name: Selenium Pytest Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      MSSQL_SA_PASSWORD: CI_Test_Passw0rd!2026
      BASE_URL: http://localhost:8090

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4
        with:
          path: automation

      - name: Checkout nopCommerce source
        uses: actions/checkout@v4
        with:
          repository: nopSolutions/nopCommerce
          ref: develop
          path: nopcommerce

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install Python dependencies
        working-directory: automation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Create CI Docker Compose file
        working-directory: nopcommerce
        shell: bash
        run: |
          cat > docker-compose.ci.yml <<'EOF'
          services:
            nopcommerce_database:
              image: mcr.microsoft.com/mssql/server:2019-latest
              environment:
                ACCEPT_EULA: "Y"
                MSSQL_PID: "Express"
                MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
              healthcheck:
                test:
                  - CMD-SHELL
                  - "timeout 2 bash -c '</dev/tcp/localhost/1433'"
                interval: 10s
                timeout: 5s
                retries: 30

            nopcommerce_web:
              build: .
              ports:
                - "8090:80"
              depends_on:
                nopcommerce_database:
                  condition: service_healthy
          EOF

      - name: Build and start SQL Server and nopCommerce
        working-directory: nopcommerce
        run: docker compose -f docker-compose.ci.yml up -d --build

            - name: Diagnose nopCommerce startup
        if: always()
        working-directory: nopcommerce
        run: |
          echo "=== Container status ==="
          docker compose -f docker-compose.ci.yml ps -a

          echo "=== Web container logs ==="
          docker compose -f docker-compose.ci.yml logs --tail=100 nopcommerce_web

          echo "=== Database container status ==="
          docker compose -f docker-compose.ci.yml logs --tail=50 nopcommerce_database
        env:
          MSSQL_SA_PASSWORD: CI_Test_Passw0rd!2026

      - name: Wait for nopCommerce HTTP response
        shell: bash
        run: |
          for i in $(seq 1 60); do
            STATUS=$(curl -sS -o /tmp/nop.html \
              -w "%{http_code}" "$BASE_URL/" || true)

            if [ "$STATUS" = "200" ]; then
              echo "nopCommerce is responding over HTTP."
              break
            fi

            echo "Waiting for nopCommerce ($i/60), HTTP: $STATUS"
            sleep 10
          done

          if [ "${STATUS:-000}" != "200" ]; then
            echo "nopCommerce did not become available."
            exit 1
          fi

      - name: Verify storefront is installed
        shell: bash
        run: |
          curl -sS -L "$BASE_URL/" -o /tmp/nop.html

          if grep -qi "nopCommerce installation" /tmp/nop.html \
             || grep -qi 'id="install' /tmp/nop.html; then
            echo "::error::nopCommerce is still showing its installation page."
            echo "The fresh CI database must be installed before Selenium tests can run."
            exit 1
          fi

          echo "Installation page was not detected."
          echo "Review the page and test results to confirm the storefront is ready."

      - name: Run pytest tests
        working-directory: automation
        run: |
          mkdir -p reports screenshots logs
          pytest -v --self-contained-html --html=reports/report.html

      - name: Show application logs on failure
        if: failure()
        working-directory: nopcommerce
        run: docker compose -f docker-compose.ci.yml logs --no-color

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-test-artifacts
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/
          if-no-files-found: warn

      - name: Stop CI containers
        if: always()
        working-directory: nopcommerce
        run: docker compose -f docker-compose.ci.yml down
