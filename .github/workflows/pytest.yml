
name: Selenium Pytest Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      MSSQL_SA_PASSWORD: "CI_Test_Passw0rd!2026"
      BASE_URL: "http://localhost:8090"
      NOP_ADMIN_EMAIL: "admin@ecommerce.com"
      NOP_ADMIN_PASSWORD: "Portaal@hcl123"

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4
        with:
          path: automation

      - name: Checkout nopCommerce source
        uses: actions/checkout@v4
        with:
          repository: nopSolutions/nopCommerce
          ref: develop
          path: nopcommerce

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install Python dependencies
        working-directory: automation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Create CI Docker Compose file
        working-directory: nopcommerce
        shell: bash
        run: |
          cat > docker-compose.ci.yml <<'EOF'
          services:
            nopcommerce_database:
              image: mcr.microsoft.com/mssql/server:2019-latest
              environment:
                ACCEPT_EULA: "Y"
                MSSQL_PID: "Express"
                MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
              healthcheck:
                test:
                  - CMD-SHELL
                  - "timeout 2 bash -c '</dev/tcp/localhost/1433'"
                interval: 10s
                timeout: 5s
                retries: 30
                start_period: 20s

            nopcommerce_web:
              build: .
              ports:
                - "8090:80"
              depends_on:
                nopcommerce_database:
                  condition: service_healthy
          EOF

      - name: Build and start SQL Server and nopCommerce
        working-directory: nopcommerce
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for nopCommerce to respond
        shell: bash
        run: |
          READY=false

          for i in $(seq 1 30); do
            STATUS=$(curl -sS \
              --connect-timeout 5 \
              --max-time 15 \
              -o /tmp/nop-response.html \
              -w "%{http_code}" \
              "$BASE_URL/" || true)

            echo "Attempt $i/30: HTTP $STATUS"

            if [ "$STATUS" = "200" ] || \
               [ "$STATUS" = "301" ] || \
               [ "$STATUS" = "302" ]; then
              READY=true
              break
            fi

            sleep 5
          done

          if [ "$READY" != "true" ]; then
            echo "::error::nopCommerce did not respond."
            exit 1
          fi

          echo "The web server is responding."

      - name: Install nopCommerce if required
        working-directory: nopcommerce
        shell: bash
        run: |
          python -m pip install requests beautifulsoup4

          cat > /tmp/install_nop.py <<'PY'
          import os
          import sys
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          base = os.environ["BASE_URL"].rstrip("/")
          session = requests.Session()

          def get_page(url):
              response = session.get(url, timeout=30)
              response.raise_for_status()
              return response

          response = get_page(base + "/install")
          soup = BeautifulSoup(response.text, "html.parser")

          form = None
          for candidate in soup.find_all("form"):
              if candidate.find("input", {"name": "AdminEmail"}):
                  form = candidate
                  break

          if form is None:
              home = get_page(base + "/")
              home_soup = BeautifulSoup(home.text, "html.parser")

              if home_soup.find(
                  "input", {"name": "AdminEmail"}
              ) or "nopCommerce installation" in home.text:
                  print("ERROR: Installer page found, but its form was not recognized.")
                  print("Final installer URL:", response.url)
                  print(response.text[:5000])
                  sys.exit(1)

              print("No installer form detected. Checking the installed storefront.")
              if "/install" in home.url.lower():
                  print("ERROR: Still redirected to the installer.")
                  sys.exit(1)

              print("Storefront is already installed.")
              sys.exit(0)

          print("Installer form detected:", response.url)

          data = {}

          for element in form.find_all(["input", "select", "textarea"]):
              name = element.get("name")
              if not name:
                  continue

              if element.name == "input":
                  kind = element.get("type", "text").lower()

                  if kind in ("submit", "button", "reset", "file"):
                      continue

                  if kind in ("checkbox", "radio"):
                      if element.has_attr("checked"):
                          data[name] = element.get("value", "true")
                      continue

                  data[name] = element.get("value", "")

              elif element.name == "select":
                  selected = element.find("option", selected=True)
                  if selected is None:
                      selected = element.find("option")
                  if selected is not None:
                      data[name] = selected.get("value", "")

              elif element.name == "textarea":
                  data[name] = element.text

          data["AdminEmail"] = os.environ["NOP_ADMIN_EMAIL"]
          data["AdminPassword"] = os.environ["NOP_ADMIN_PASSWORD"]
          data["ConfirmPassword"] = os.environ["NOP_ADMIN_PASSWORD"]

          # Select the SQL Server provider offered by this installer.
          provider_select = form.find("select", {"name": "DataProvider"})
          if provider_select:
              options = provider_select.find_all("option")
              sql_option = next(
                  (
                      option for option in options
                      if "sqlserver" in (
                          option.get("value", "") + " " + option.text
                      ).lower()
                  ),
                  None,
              )
              if sql_option is None:
                  print("ERROR: SQL Server provider option not found.")
                  print([(o.get("value"), o.text.strip()) for o in options])
                  sys.exit(1)
              data["DataProvider"] = sql_option.get("value", "")

          # These are the expected SQL Server installer model fields.
          data.update({
              "ConnectionStringRaw": "false",
              "IntegratedSecurity": "false",
              "ServerName": "nopcommerce_database",
              "DatabaseName": "nopCommerce",
              "Username": "sa",
              "Password": os.environ["MSSQL_SA_PASSWORD"],
              "CreateDatabaseIfNotExists": "true",
              "InstallSampleData": "true",
              "SubscribeNewsletters": "false",
              "UseCustomCollation": "false",
          })

          action = urljoin(response.url, form.get("action") or response.url)

          print("Submitting installation form to:", action)
          print("Database server: nopcommerce_database")
          print("Database name: nopCommerce")

          result = session.post(
              action,
              data=data,
              timeout=1200,
              allow_redirects=True,
          )

          print("Installation response status:", result.status_code)
          print("Installation final URL:", result.url)

          result_soup = BeautifulSoup(result.text, "html.parser")
          errors = []

          for selector in (
              ".message-error",
              ".validation-summary-errors",
              ".field-validation-error",
          ):
              for element in result_soup.select(selector):
                  message = element.get_text(" ", strip=True)
                  if message and message not in errors:
                      errors.append(message)

          if errors:
              print("Installation validation errors:")
              for error in errors:
                  print("-", error)
              sys.exit(1)

          if result.status_code >= 400:
              print(result.text[:5000])
              sys.exit(1)

          # Installation may request an application restart.
          restart_url = urljoin(base + "/", "install/restartapplication")
          try:
              restart = session.get(restart_url, timeout=30)
              print("Restart endpoint status:", restart.status_code)
          except requests.RequestException as exc:
              print("Restart request disconnected (may be expected):", exc)

          print("Installation form submitted; verifying after restart.")
          PY

          python /tmp/install_nop.py

      - name: Restart nopCommerce web container
        working-directory: nopcommerce
        run: |
          docker compose -f docker-compose.ci.yml restart nopcommerce_web

      - name: Wait for installed storefront
        shell: bash
        run: |
          READY=false

          for i in $(seq 1 30); do
            STATUS=$(curl -sS -L \
              --max-redirs 10 \
              --connect-timeout 5 \
              --max-time 20 \
              -o /tmp/nop-home.html \
              -w "%{http_code}" \
              "$BASE_URL/" || true)

            echo "Attempt $i/30: final HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              if ! grep -qi "nopCommerce installation" /tmp/nop-home.html \
                 && ! grep -qi 'name="AdminEmail"' /tmp/nop-home.html; then
                READY=true
                break
              fi
            fi

            sleep 5
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Storefront is not ready or installation is incomplete."
            echo "Final URL and response:"
            curl -sS -L -D /tmp/nop-headers.txt \
              -o /tmp/nop-home.html "$BASE_URL/" || true
            cat /tmp/nop-headers.txt || true
            head -c 4000 /tmp/nop-home.html || true
            exit 1
          fi

          echo "Installed storefront is responding."

      - name: Run pytest tests
        working-directory: automation
        run: |
          mkdir -p reports screenshots logs
          pytest -v --self-contained-html --html=reports/report.html

      - name: Collect container logs
        if: always()
        working-directory: nopcommerce
        run: |
          docker compose -f docker-compose.ci.yml ps -a || true
          docker compose -f docker-compose.ci.yml logs --no-color \
            > ../automation/logs/docker-compose.log 2>&1 || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-test-artifacts
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/
          if-no-files-found: warn

      - name: Stop CI containers
        if: always()
        working-directory: nopcommerce
        run: docker compose -f docker-compose.ci.yml down -v
